[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
markers =
    postgres: requires a live PostgreSQL + pgvector database (TEST_DATABASE_URL)
    ollama: requires a live Ollama server with the configured models pulled
filterwarnings =
    ignore::DeprecationWarning
